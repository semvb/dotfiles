separator_block_width=10


# Memory usage
[memory]
label=MEM: 
command=free -h | awk '/Mem: / {print $3 "/" $2}'
interval=10
color=#7ea1a5

# GPU usage
[gpu_usage]
label=GPU Usage: 
command=cat /sys/class/drm/card1/device/gpu_busy_percent | awk '{print $1 "%"}'
interval=5
color=#a3be8c

# GPU temp
[gpu_temp]
label=GPU TEMP: 
command=awk '{printf "%.0f°C\n", $1/1000}' /sys/class/drm/card1/device/hwmon/hwmon*/temp2_input
interval=10
color=#a3be8c

# CPU usage 
[cpu]
label=CPU Usage: 
command=top -bn1 | grep "Cpu(s)" | awk '{print 100-$8"%"}'
interval=5
color=#ebcb8b

# CPU temperature 
[temperature]
label=CPU TEMP: 
command=sensors | awk '/Package id 0|Tctl/ {print $2; exit}'
interval=10
color=#ebcb8b

# Disk usage
[disk]
label=HOME: 
command=df -h /home | awk 'NR==2 {print $3 "/" $2}'
interval=60
color=#29FF1E

# Time
[time]
command=date '+%H:%M %d-%m-%Y'
interval=5
