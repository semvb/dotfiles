separator_block_width=10


# Memory usage
[memory]
label=MEM:
command=free -h | awk '/Mem: / {print $3 "/" $2}'
interval=10
color=#7ea1a5

# CPU usage
[cpu]
label=CPU Usage:
command=top -bn1 | grep "Cpu(s)" | awk '{print $2 + $4 + $6"%"}'
interval=5
color=#ebcb8b

# Disk usage
[disk]
label=HOME:
command=df -h /home | awk 'NR==2 {print $3 "/" $2}'
interval=60
color=#29FF1E

[battery]
label=BAT:
command=echo "$(cat /sys/class/power_supply/BAT0/capacity)%"
interval=30
color=#a3be8c

# Volume
[volume]
label=VOL:
command=wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{ if ($3 == "[MUTED]") print "muted"; else print int($2*100) "%" }'
interval=60
signal=10
color=#88c0d0

# Time
[time]
command=date '+%H:%M %d-%m-%Y'
interval=5
